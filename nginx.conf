# 要求仕様ID: PLT.1-DOCKER.1 - 本番環境Nginx設定

# ワーカープロセス設定
worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # 基本設定
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset UTF-8;

    # ログ形式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # パフォーマンス最適化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip圧縮
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # セキュリティヘッダー
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # アップストリーム設定（Next.jsアプリケーション）
    upstream nextjs_upstream {
        server app:3000;
        keepalive 64;
    }

    # HTTPサーバー（HTTPSへリダイレクト）
    server {
        listen 80;
        server_name _;

        # ヘルスチェック用エンドポイント
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 開発環境ではHTTPを許可、本番ではHTTPSへリダイレクト
        location / {
            # 本番環境では以下のコメントを外してHTTPSへリダイレクト
            # return 301 https://$host$request_uri;

            # 開発環境用（そのままNext.jsへプロキシ）
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }

    # HTTPSサーバー（本番環境用）
    # SSL証明書を配置後、以下のコメントを外して有効化
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL証明書
    #     ssl_certificate /etc/nginx/ssl/certificate.crt;
    #     ssl_certificate_key /etc/nginx/ssl/private.key;
    #
    #     # SSL設定
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # セキュリティヘッダー
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # Next.js静的ファイル（キャッシュ有効）
    #     location /_next/static {
    #         proxy_pass http://nextjs_upstream;
    #         proxy_cache_valid 200 60m;
    #         add_header Cache-Control "public, max-age=3600, immutable";
    #     }
    #
    #     # 画像などの静的リソース
    #     location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    #         proxy_pass http://nextjs_upstream;
    #         expires 1y;
    #         add_header Cache-Control "public, max-age=31536000, immutable";
    #     }
    #
    #     # APIエンドポイント（キャッシュなし）
    #     location /api {
    #         proxy_pass http://nextjs_upstream;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_cache_bypass $http_upgrade;
    #         proxy_read_timeout 300s;
    #         proxy_connect_timeout 75s;
    #     }
    #
